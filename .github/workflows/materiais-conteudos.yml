name: Materiais e Conteúdos Automático

on:
  schedule:
    # 08:00 horário de Brasília
    - cron: "0 11 * * *"

    # 14:00 horário de Brasília
    - cron: "0 17 * * *"

    # 20:00 horário de Brasília
    - cron: "0 23 * * *"

  workflow_dispatch:
    inputs:
      produto:
        description: "Escolha o produto para publicar no teste"
        required: true
        type: choice
        options:
          - home-office
          - formula-hol
          - avaliador-mapas
          - avaliador-digital

jobs:
  publicar-material:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar produto
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            echo "Publicando produto selecionado: ${{ inputs.produto }}"

            python -m radar_vagas.produtos_publisher \
              "${{ inputs.produto }}" \
              --variation $(( $(date -u +%s) / 86400 % 2 ))

          else

            HOUR=$(date -u +%H)
            DAY=$(date -u +%j)

            echo "Horário UTC da execução: $HOUR"
            echo "Dia do ano: $DAY"

            # Quatro produtos disponíveis.
            PRODUCTS=(
              "home-office"
              "formula-hol"
              "avaliador-mapas"
              "avaliador-digital"
            )

            # Identifica qual dos 3 horários do dia está sendo executado.
            if [ "$HOUR" = "11" ]; then
              SLOT=0
            elif [ "$HOUR" = "17" ]; then
              SLOT=1
            elif [ "$HOUR" = "23" ]; then
              SLOT=2
            else
              echo "Horário sem publicação configurada."
              exit 0
            fi

            # Faz a sequência continuar de um dia para o outro.
            #
            # Cada dia possui 3 publicações.
            # Como existem 4 produtos, o próximo produto
            # continua a partir de onde o dia anterior terminou.
            INDEX=$(( ((DAY - 1) * 3 + SLOT) % 4 ))

            PRODUTO="${PRODUCTS[$INDEX]}"

            echo "Produto selecionado automaticamente: $PRODUTO"

            if [ "$PRODUTO" = "home-office" ]; then
              echo "Publicando: Guia Home Office Internacional"

            elif [ "$PRODUTO" = "formula-hol" ]; then
              echo "Publicando: Fórmula HOL"

            elif [ "$PRODUTO" = "avaliador-mapas" ]; then
              echo "Publicando: Guia Avaliador de Mapas"

            elif [ "$PRODUTO" = "avaliador-digital" ]; then
              echo "Publicando: Guia Avaliador Digital"
            fi

            python -m radar_vagas.produtos_publisher \
              "$PRODUTO" \
              --variation $(( $(date -u +%s) / 86400 % 2 ))

          fi
