name: Materiais e Conteúdos Automático

on:
  workflow_dispatch:

jobs:
  testar-materiais:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Testar conexão com Materiais e Conteúdos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_MATERIAIS_THREAD_ID }}
        run: python -m radar_vagas --send-test --confirm-send-test
