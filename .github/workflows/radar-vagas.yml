name: Descobrir Tópico Materiais e Conteúdos

on:
  workflow_dispatch:

jobs:
  descobrir-topico:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descobrir tópico Materiais e Conteúdos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m radar_vagas --discover-telegram-topic --topic-name "Materiais e Conteúdos" --wait-seconds 120
