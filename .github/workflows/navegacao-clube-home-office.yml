name: Navegação Clube Home Office

on:
  schedule:
    # 09:00, 14:00 e 20:00 no horário de Brasília
    # Brasília = UTC-3
    - cron: "0 12 * * *"
    - cron: "0 17 * * *"
    - cron: "0 23 * * *"

  workflow_dispatch:

concurrency:
  group: navegacao-clube-home-office
  cancel-in-progress: false

jobs:
  navegacao:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar navegacao
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

        run: |
          python -m radar_vagas.navegacao_clube
