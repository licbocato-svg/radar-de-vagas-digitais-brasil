name: Publicar Blog Automaticamente

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar novo artigo do blog
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID_MATERIAIS }}
        run: python -m radar_vagas.blog_publisher

      - name: Salvar ultimo artigo publicado
        run: |
          if [ -n "$(git status --porcelain data/blog_last_published.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/blog_last_published.json
            git commit -m "Atualizar ultimo artigo publicado do blog"
            git push
          fi
