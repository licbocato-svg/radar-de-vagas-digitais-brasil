name: Publicar Blog Automaticamente

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar novo artigo do blog
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_MATERIAIS_THREAD_ID }}
        run: python -m radar_vagas.blog_publisher

      - name: Salvar ultimo artigo publicado
        run: |
          if [ -f "data/blog_last_published.json" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add -f data/blog_last_published.json

            if git diff --cached --quiet; then
              echo "Nenhuma alteração no histórico do blog."
            else
              git commit -m "Atualizar ultimo artigo publicado do blog"
              git push
            fi
          else
            echo "Arquivo de histórico do blog não foi criado."
          fi
